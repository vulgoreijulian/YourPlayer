<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YourPlayer - Criador de Card FC26</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Link do ficheiro CSS externo -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-yellow-500 selection:text-black">

  <!-- TELA DE EDIÇÃO -->
  <div id="editor-screen" class="w-full max-w-7xl mx-auto p-4 md:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
    
    <div class="lg:col-span-5 flex flex-col items-center justify-center sticky top-8">
      <h1 class="text-3xl font-extrabold text-yellow-400 mb-6 tracking-wider uppercase drop-shadow">YourPlayer</h1>

      <div id="card-container" class="relative w-80 h-[490px] p-1.5 fc-card-border card-glow transition-transform hover:scale-105 duration-300">
        <div class="w-full h-full fc-card-bg fc-card-shape relative overflow-hidden flex flex-col justify-between p-4">
          <div class="absolute inset-0 card-rays pointer-events-none"></div>

          <div class="relative z-10 grid grid-cols-12 gap-1 items-start mt-2">
            <div class="col-span-4 flex flex-col items-center leading-none">
              <span id="display-ovr" class="font-teko text-7xl font-extrabold text-yellow-300 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] tracking-tight">--</span>
              <span id="display-pos" class="text-2xl font-black text-yellow-100 uppercase tracking-wider drop-shadow-md -mt-2">ST</span>
            </div>

            <div class="col-span-8 h-48 relative flex items-end justify-center overflow-hidden">
              <img id="display-photo" src="" alt="Jogador" class="hidden max-h-full object-contain z-10 drop-shadow-[0_8px_8px_rgba(0,0,0,0.7)]">
              <div id="display-placeholder" class="w-32 h-40 bg-yellow-500/10 rounded-t-full border-2 border-dashed border-yellow-500/30 flex items-center justify-center">
                <svg class="w-16 h-16 text-yellow-500/40" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
              </div>
            </div>
          </div>

          <div class="relative z-10 text-center border-t-2 border-b-2 border-yellow-500/40 py-1 bg-black/40 backdrop-blur-sm my-1">
            <h2 id="display-name" class="font-teko text-4xl font-extrabold text-white tracking-widest uppercase truncate px-2 drop-shadow-md">NOME DO JOGADOR</h2>
          </div>

          <div class="relative z-10">
            <div id="stats-grid" class="grid grid-cols-6 gap-1 text-center bg-black/50 p-2 rounded border border-yellow-500/30 mb-2">
              <div>
                <span class="block text-[10px] font-bold text-yellow-400/80 tracking-tighter" id="lbl-s1">PAC</span>
                <span id="val-s1" class="font-teko text-2xl font-bold text-white leading-none">0</span>
              </div>
              <div>
                <span class="block text-[10px] font-bold text-yellow-400/80 tracking-tighter" id="lbl-s2">SHO</span>
                <span id="val-s2" class="font-teko text-2xl font-bold text-white leading-none">0</span>
              </div>
              <div>
                <span class="block text-[10px] font-bold text-yellow-400/80 tracking-tighter" id="lbl-s3">PAS</span>
                <span id="val-s3" class="font-teko text-2xl font-bold text-white leading-none">0</span>
              </div>
              <div>
                <span class="block text-[10px] font-bold text-yellow-400/80 tracking-tighter" id="lbl-s4">DRI</span>
                <span id="val-s4" class="font-teko text-2xl font-bold text-white leading-none">0</span>
              </div>
              <div>
                <span class="block text-[10px] font-bold text-yellow-400/80 tracking-tighter" id="lbl-s5">DEF</span>
                <span id="val-s5" class="font-teko text-2xl font-bold text-white leading-none">0</span>
              </div>
              <div>
                <span class="block text-[10px] font-bold text-yellow-400/80 tracking-tighter" id="lbl-s6">PHY</span>
                <span id="val-s6" class="font-teko text-2xl font-bold text-white leading-none">0</span>
              </div>
            </div>

            <div class="flex items-center justify-center space-x-6 pb-2">
              <img id="display-flag" src="https://flagcdn.com/w40/br.png" alt="País" class="h-6 w-9 object-cover rounded shadow border border-yellow-500/40">
              <img id="display-club" src="https://media.api-sports.io/football/teams/127.png" alt="Time" class="h-8 w-8 object-contain drop-shadow">
            </div>
          </div>

        </div>
      </div>

      <button onclick="goToShowcase()" class="mt-8 w-80 bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-black font-extrabold py-3 px-6 rounded-lg shadow-lg transform active:scale-95 transition tracking-widest text-lg uppercase flex items-center justify-center space-x-2">
        <span>Finalizar Jogador</span>
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </button>
    </div>

    <!-- PAINEL DE CONTROLES -->
    <div class="lg:col-span-7 bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-2xl backdrop-blur-md">
      <h2 class="text-2xl font-bold text-yellow-400 mb-6 border-b border-slate-800 pb-3 flex items-center">Personalizar Jogador</h2>

      <div class="space-y-5">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="md:col-span-2">
            <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Nome do Jogador</label>
            <input type="text" id="input-name" placeholder="Ex: Cristiano Ronaldo" oninput="updateCardInfo()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-yellow-500 transition">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Posição</label>
            <select id="input-pos" onchange="updatePosition()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-yellow-500 transition">
              <option value="ST">ST (Avançado)</option>
              <option value="CF">CF (Segundo Avançado)</option>
              <option value="LW">LW (Extremo Esq.)</option>
              <option value="RW">RW (Extremo Dir.)</option>
              <option value="CAM">CAM (Médio Ofensivo)</option>
              <option value="CM">CM (Médio Centro)</option>
              <option value="CDM">CDM (Médio Defensivo)</option>
              <option value="LB">LB (Lateral Esq.)</option>
              <option value="RB">RB (Lateral Dir.)</option>
              <option value="CB">CB (Defesa Central)</option>
              <option value="GK">GK (Guarda-Redes)</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Foto do Jogador (Upload ou URL)</label>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <input type="file" id="input-photo-file" accept="image/*" onchange="handleFileUpload(event)" class="text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-yellow-500 file:text-black hover:file:bg-yellow-400 cursor-pointer bg-slate-950 border border-slate-700 rounded-lg">
            <input type="text" id="input-photo-url" placeholder="Ou cole a URL da imagem..." oninput="handleUrlUpload()" class="bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-yellow-500">
          </div>
        </div>

        <div class="relative">
          <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Pesquisar País / Nacionalidade</label>
          <input type="text" id="input-search-country" placeholder="Digite o nome do país..." oninput="filterCountries()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-yellow-500 transition">
          <div id="country-dropdown" class="absolute z-30 left-0 right-0 mt-1 max-h-48 overflow-y-auto bg-slate-900 border border-slate-700 rounded-lg shadow-xl hidden"></div>
        </div>

        <div class="relative">
          <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Pesquisar Clube / Time</label>
          <input type="text" id="input-search-club" placeholder="Digite o nome do clube..." oninput="filterClubs()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-yellow-500 transition">
          <div id="club-dropdown" class="absolute z-30 left-0 right-0 mt-1 max-h-48 overflow-y-auto bg-slate-900 border border-slate-700 rounded-lg shadow-xl hidden"></div>
        </div>

        <div class="pt-4 border-t border-slate-800">
          <div class="flex items-center justify-between mb-3">
            <label class="text-xs font-bold uppercase text-slate-400">Atributos do Jogador (1 a 99)</label>
            <span class="text-xs text-yellow-400 font-semibold">* Preencha todos os 6 para calcular o OVR</span>
          </div>
          
          <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
            <div>
              <label id="lbl-input-s1" class="block text-xs font-bold text-slate-300 mb-1">PAC (Ritmo)</label>
              <input type="number" min="1" max="99" id="input-s1" placeholder="0" oninput="validateAndCalculateOVR()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-yellow-500">
            </div>
            <div>
              <label id="lbl-input-s2" class="block text-xs font-bold text-slate-300 mb-1">SHO (Remate)</label>
              <input type="number" min="1" max="99" id="input-s2" placeholder="0" oninput="validateAndCalculateOVR()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-yellow-500">
            </div>
            <div>
              <label id="lbl-input-s3" class="block text-xs font-bold text-slate-300 mb-1">PAS (Passe)</label>
              <input type="number" min="1" max="99" id="input-s3" placeholder="0" oninput="validateAndCalculateOVR()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-yellow-500">
            </div>
            <div>
              <label id="lbl-input-s4" class="block text-xs font-bold text-slate-300 mb-1">DRI (Drible)</label>
              <input type="number" min="1" max="99" id="input-s4" placeholder="0" oninput="validateAndCalculateOVR()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-yellow-500">
            </div>
            <div>
              <label id="lbl-input-s5" class="block text-xs font-bold text-slate-300 mb-1">DEF (Defesa)</label>
              <input type="number" min="1" max="99" id="input-s5" placeholder="0" oninput="validateAndCalculateOVR()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-yellow-500">
            </div>
            <div>
              <label id="lbl-input-s6" class="block text-xs font-bold text-slate-300 mb-1">PHY (Físico)</label>
              <input type="number" min="1" max="99" id="input-s6" placeholder="0" oninput="validateAndCalculateOVR()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-yellow-500">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- TELA DE APRESENTAÇÃO (SHOWCASE) -->
  <div id="showcase-screen" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center hidden">
    <button onclick="goToEditor()" class="absolute top-8 left-8 p-3 text-yellow-400 hover:text-yellow-300 bg-slate-900/80 border border-yellow-500/30 rounded-full transition transform active:scale-90 shadow-xl">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
      </svg>
    </button>

    <div id="showcase-card-wrapper" class="transform scale-125 md:scale-150 transition duration-500"></div>
  </div>

  <!-- Link do ficheiro JS externo -->
  <script src="script.js"></script>
</body>
</html>
